repoServer:
  automountServiceAccountToken: true

  volumes:
    - name: cmp-plugin
      configMap:
        name: cmp-plugin
    - name: custom-tools
      emptyDir: {}
    - name: cmp-tmp
      emptyDir: {}
    - name: vault-ca
      secret:
        secretName: vault-ca
        optional: true

  initContainers:
    - name: download-tools
      image: registry.access.redhat.com/ubi9/ubi-minimal
      command: ["/bin/sh", "-c"]
      args:
        - |
          curl -L -o /custom-tools/argocd-vault-plugin \
            https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v1.18.1/argocd-vault-plugin_1.18.1_linux_amd64 && \
          chmod +x /custom-tools/argocd-vault-plugin
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

  extraContainers:
    - name: avp
      image: quay.io/argoproj/argocd:v2.14.20
      command: ["/var/run/argocd/argocd-cmp-server"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          value: "180"
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
          name: cmp-plugin
        - mountPath: /usr/local/bin/argocd-vault-plugin
          subPath: argocd-vault-plugin
          name: custom-tools
        - mountPath: /tmp
          name: cmp-tmp
        - mountPath: /vault/tls
          name: vault-ca
          readOnly: true