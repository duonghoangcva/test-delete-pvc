apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: php-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/duonghoangcva/test-delete-pvc.git
        revision: main
        directories:
          - path: app/app-*
  template:
    metadata:
      name: '{{ index .path.segments 1 }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/duonghoangcva/test-delete-pvc.git
        targetRevision: main
        path: app/charts/php-app
        plugin:
          name: argocd-vault-plugin-helm
          env:
            - name: HELM_ARGS
              value: '-f ../../{{ index .path.segments 1 }}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true