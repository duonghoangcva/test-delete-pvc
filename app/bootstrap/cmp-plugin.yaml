apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: argocd-vault-plugin-helm
    spec:
      allowConcurrency: true
      discover:
        find:
          command:
            - sh
            - -c
            - "find . -name 'Chart.yaml'"
      generate:
        command:
          - sh
          - -c
          - |
            helm template "$ARGOCD_APP_NAME" \
              --include-crds \
              -n "$ARGOCD_APP_NAMESPACE" \
              ${ARGOCD_ENV_HELM_ARGS} . \
            | argocd-vault-plugin generate -s vault-configuration -
      lockRepo: false