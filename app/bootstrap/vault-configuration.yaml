apiVersion: v1
kind: Secret
metadata:
  name: vault-configuration
  namespace: argocd
type: Opaque
stringData:
  AVP_TYPE: vault
  AVP_AUTH_TYPE: k8s
  AVP_K8S_ROLE: argocd
  AVP_K8S_MOUNT_PATH: auth/kubernetes
  AVP_KV_VERSION: "2"
  VAULT_ADDR: https://vault.vault.svc:8200
  VAULT_CACERT: /vault/tls/ca.crt