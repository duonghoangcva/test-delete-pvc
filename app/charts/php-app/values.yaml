image:
  repository: php
  tag: "8.2-apache"
  pullPolicy: IfNotPresent

promtail:
  enabled: false
  image:
    repository: grafana/promtail
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  lokiPushUrl: http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push

persistence:
  logs:
    storageClass: standard
    size: 1Gi
    accessModes:
      - ReadWriteOnce