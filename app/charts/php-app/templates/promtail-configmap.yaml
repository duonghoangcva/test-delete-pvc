{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: {{ .Values.promtail.lokiPushUrl | quote }}

    scrape_configs:
      - job_name: php-file-logs
        static_configs:
          - targets:
              - localhost
            labels:
              app: {{ .Release.Name | quote }}
              namespace: {{ .Release.Namespace | quote }}
              __path__: /var/www/html/storage/logs/*.log
{{- end }}